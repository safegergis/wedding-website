<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- Coptic cross in the site's palette: blush-100 ground, blush-700 cross.
       Each arm ends in three points, twelve in all, as the tradition draws it. -->
  <rect x="-50" y="-50" width="100" height="100" rx="22" fill="#f8ece8"/>
  <defs>
    <path id="arm" d="M -6.5 0 L -6.5 -26 L -13.5 -40 L -9 -48 L -4.5 -40.5 L 0 -48 L 4.5 -40.5 L 9 -48 L 13.5 -40 L 6.5 -26 L 6.5 0 Z"/>
  </defs>
  <g fill="#7e262a">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(90)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(270)"/>
  </g>
</svg>
